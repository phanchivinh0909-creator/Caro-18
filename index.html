<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Caro Siêu Cấp - 15x15</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --board-bg: #1e293b;
            --cell-bg: #334155;
            --cell-hover: #475569;
            --x-color: #f43f5e;
            --o-color: #38bdf8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        /* Theme: Hồng Pastel kết hợp Hoa Anh Đào */
        body.theme-pink {
            --bg-color: #fff1f2;
            --panel-bg: rgba(255, 228, 230, 0.9);
            --text-color: #881337;
            --accent-color: #f43f5e;
            --accent-hover: #e11d48;
            --board-bg: #ffe4e6;
            --cell-bg: #fecdd3;
            --cell-hover: #fda4af;
            --x-color: #be123c;
            --o-color: #0284c7;
            background-image: radial-gradient(#fda4af 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        /* Theme: Xanh Bạc Hà */
        body.theme-green {
            --bg-color: #ecfdf5;
            --panel-bg: rgba(209, 250, 229, 0.9);
            --text-color: #064e3b;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --board-bg: #d1fae5;
            --cell-bg: #a7f3d0;
            --cell-hover: #6ee7b7;
            --x-color: #047857;
            --o-color: #2563eb;
            background-image: radial-gradient(#6ee7b7 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.2s, color 0.2s, transform 0.15s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 50;
            padding: 20px;
            top: 0;
            left: 0;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        .menu-card {
            background: var(--panel-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.35s ease-out;
        }

        @keyframes fadeIn {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .menu-card h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .menu-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .menu-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .menu-btn:active {
            transform: scale(0.97);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 700px;
            width: 100%;
            z-index: 10;
        }

        .game-container.hidden {
            display: none !important;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            font-weight: 650;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.96);
        }

        .online-panel {
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .online-panel input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
            width: 140px;
            text-align: center;
            font-weight: bold;
        }

        .board-container {
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 18px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 32px);
            grid-template-rows: repeat(15, 32px);
            gap: 3px;
            background-color: var(--board-bg);
            padding: 6px;
            border-radius: 10px;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        .cell:hover {
            background-color: var(--cell-hover);
            transform: scale(1.06);
        }

        .cell.x { color: var(--x-color); text-shadow: 0 0 8px rgba(244, 63, 94, 0.4); }
        .cell.o { color: var(--o-color); text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 1000;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.15);
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 { margin-bottom: 20px; font-size: 1.5rem; }

        .shop-items {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .shop-btn {
            background: var(--cell-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 10px 14px;
            font-size: 0.85rem;
            border-radius: 10px;
            cursor: pointer;
        }

        .shop-btn.active { border-color: var(--accent-color); }

        .setting-group {
            margin: 15px 0;
            text-align: left;
        }

        .setting-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .setting-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        /* Hiệu ứng hoa anh đào / lá bạc hà rơi */
        .falling-item {
            position: fixed;
            top: -15px;
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }
        @keyframes fall {
            0% { transform: translateY(-15px) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHỜ (MENU CHÍNH) -->
    <div class="screen" id="main-menu">
        <div class="menu-card">
            <h1>Cờ Caro Siêu Cấp</h1>
            <button class="menu-btn" onclick="openModeSelect()">🎮 Chơi Ngay</button>
            <button class="menu-btn" onclick="openShopModal()" style="background: #10b981;">🎨 Cửa Hàng Giao Diện</button>
            <button class="menu-btn" onclick="openSettingsModal()" style="background: #64748b;">⚙️ Cài Đặt Âm Thanh</button>
        </div>
    </div>

    <!-- MÀN HÌNH CHỌN CHẾ ĐỘ CHƠI -->
    <div class="screen hidden" id="mode-select-screen">
        <div class="menu-card">
            <h1>Chọn Chế Độ</h1>
            <button class="menu-btn" onclick="startGameMode('AI-Easy')">🤖 Đấu với Máy (Dễ)</button>
            <button class="menu-btn" onclick="startGameMode('AI-Medium')">🧠 Đấu với Máy (Trung Bình)</button>
            <button class="menu-btn" onclick="startGameMode('AI-Hard')">🔥 Đấu với Máy (Khó)</button>
            <button class="menu-btn" onclick="startGameMode('Local')">👥 2 Người (Chung Máy)</button>
            <button class="menu-btn" onclick="startGameMode('Online')" style="background: #0284c7;">🌐 Chế Độ Online</button>
            <button class="menu-btn" onclick="backToMenu()" style="background: #ef4444;">⬅️ Quay Lại</button>
        </div>
    </div>

    <!-- GIAO DIỆN GAME CHÍNH -->
    <div class="game-container hidden" id="game-screen">
        <header>
            <h1 style="font-size: 1.6rem; letter-spacing: 1px;">CỜ CARO 15x15</h1>
        </header>

        <div class="stats-bar">
            <div id="turn-indicator">Lượt: <span style="color: var(--x-color);">X</span></div>
            <div>💰 Xu: <span id="coin-count">100</span></div>
            <div>Chế độ: <span id="mode-display">Đấu với Máy</span></div>
            <button onclick="backToMenu()" style="padding: 3px 8px; font-size: 0.8rem; background: #ef4444;">Menu</button>
        </div>

        <div class="controls">
            <button onclick="resetGame()">🔄 Ván Mới</button>
            <button onclick="openShopModal()">🎨 Đổi Giao Diện</button>
            <button onclick="openSettingsModal()">⚙️ Cài Đặt</button>
        </div>

        <!-- Khung Online -->
        <div class="online-panel" id="online-controls" style="display: none;">
            <button onclick="createRoom()">Tạo Phòng</button>
            <input type="text" id="room-code-input" placeholder="Mã 4 số">
            <button onclick="joinRoom()">Vào Phòng</button>
            <span id="connection-status" style="font-size: 0.85rem; opacity: 0.85; width: 100%; text-align: center;">Chưa kết nối phòng</span>
        </div>

        <div class="board-container">
            <div class="board" id="board"></div>
        </div>
    </div>

    <!-- MODAL CỬA HÀNG GIAO DIỆN -->
    <div class="modal" id="shop-modal">
        <div class="modal-content">
            <h2>Cửa Hàng Giao Diện</h2>
            <div class="shop-items">
                <button class="shop-btn active" onclick="setTheme('default', 0)">Mặc Định (0 xu)</button>
                <button class="shop-btn" onclick="setTheme('pink', 30)">🌸 Hồng Sakura (30 xu)</button>
                <button class="shop-btn" onclick="setTheme('green', 30)">🌿 Xanh Bạc Hà (30 xu)</button>
            </div>
            <button onclick="closeModal('shop-modal')">Đóng</button>
        </div>
    </div>

    <!-- MODAL CÀI ĐẶT ÂM THANH -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2>Cài Đặt Âm Thanh</h2>
            <div class="setting-group">
                <label>🎵 Nhạc Nền Chill:</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.3" oninput="updateVolume()">
                    <button onclick="toggleBGM()" id="bgm-toggle-btn" style="padding: 6px 12px; font-size: 0.85rem;">Tắt/Bật</button>
                </div>
            </div>
            <div class="setting-group">
                <label>🔊 Âm Thanh Đánh Cờ (SFX):</label>
                <input type="range" id="sfx-volume" min="0" max="1" step="0.05" value="0.6">
            </div>
            <br>
            <button onclick="closeModal('settings-modal')">Lưu & Đóng</button>
        </div>
    </div>

    <!-- MODAL THẮNG / THUA -->
    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2 id="winner-text">X Thắng Cuộc!</h2>
            <p id="reward-text" style="margin-bottom: 20px;">Bạn nhận được +20 xu!</p>
            <button onclick="closeWinModal()">Chơi Tiếp</button>
        </div>
    </div>

    <!-- CODE JAVASCRIPT ĐẦY ĐỦ -->
    <script>
        const BOARD_SIZE = 15;
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'AI-Hard';
        let coins = parseInt(localStorage.getItem('caro_coins')) || 100;
        let currentTheme = localStorage.getItem('caro_theme') || 'default';

        let onlinePeer = null;
        let onlineConn = null;
        let myRole = '';

        document.getElementById('coin-count').innerText = coins;
        setTheme(currentTheme, 0);
        createBoard();

        function openModeSelect() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('mode-select-screen').classList.remove('hidden');
        }

        function backToMenu() {
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('mode-select-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            if(onlinePeer) { onlinePeer.destroy(); onlinePeer = null; }
        }

        function startGameMode(mode) {
            gameMode = mode;
            document.getElementById('mode-select-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            let name = 'Đấu với Máy (Khó)';
            if(mode === 'AI-Easy') name = 'Đấu với Máy (Dễ)';
            if(mode === 'AI-Medium') name = 'Đấu với Máy (Trung bình)';
            if(mode === 'Local') name = '2 Người (Chung máy)';
            if(mode === 'Online') {
                name = 'Chế độ Online';
                document.getElementById('online-controls').style.display = 'flex';
                initPeerConnection();
            } else {
                document.getElementById('online-controls').style.display = 'none';
            }
            document.getElementById('mode-display').innerText = name;
            resetGame();
        }

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if (!gameActive || board[r][c] !== '') return;

            if (gameMode === 'Online') {
                if (!onlineConn || !onlineConn.open) {
                    alert("Chưa kết nối phòng mạng!");
                    return;
                }
                if (currentPlayer !== myRole) {
                    alert("Chưa đến lượt bạn!");
                    return;
                }
                onlineConn.send({ type: 'move', r: r, c: c, player: currentPlayer });
            }

            makeMove(r, c, currentPlayer);
            playSFX();

            if (checkWin(r, c, currentPlayer)) {
                endGame(currentPlayer);
                return;
            }
            if (checkDraw()) {
                endGame('Draw');
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnDisplay();

            if (gameMode.startsWith('AI') && gameActive && currentPlayer === 'O') {
                setTimeout(aiTurn, 350);
            }
        }

        function makeMove(r, c, player) {
            board[r][c] = player;
            const cell = document.querySelectorAll('.cell')[r * BOARD_SIZE + c];
            cell.innerText = player;
            cell.classList.add(player.toLowerCase());
        }

        // AI thông minh với cấp độ
        function aiTurn() {
            let move = null;
            if (gameMode === 'AI-Hard') {
                move = getBestAIMove();
            } else if (gameMode === 'AI-Medium') {
                // Tăng độ khôn cho trung bình: 85% đánh nước tốt/chặn nguy hiểm, 15% ngẫu nhiên thông minh
                move = Math.random() < 0.85 ? getBestAIMove() : getSmartRandomMove();
            } else {
                // Tăng độ khôn cho dễ: Biết chặn khi người chơi sắp thắng 4 nước hoặc đánh quanh ô có sẵn
                move = getEasySmartMove();
            }

            if (move) {
                makeMove(move.r, move.c, 'O');
                playSFX();
                if (checkWin(move.r, move.c, 'O')) {
                    endGame('O');
                    return;
                }
                if (checkDraw()) {
                    endGame('Draw');
                    return;
                }
                currentPlayer = 'X';
                updateTurnDisplay();
            }
        }

        function getBestAIMove() {
            let bestScore = -Infinity;
            let bestMove = null;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') {
                        board[r][c] = 'O';
                        let score = evaluatePosition(r, c, 'O') * 1.3;
                        board[r][c] = 'X';
                        score += evaluatePosition(r, c, 'X');
                        board[r][c] = '';
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = { r, c };
                        }
                    }
                }
            }
            return bestMove || getSmartRandomMove();
        }

        // AI Dễ thông minh hơn: Kiểm tra nếu người chơi có 3 hoặc 4 nước liền thì chặn, còn lại đánh gần quân cờ
        function getEasySmartMove() {
            // Kiểm tra xem người chơi có nước nào sắp thắng (3 hoặc 4 con) để chặn
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') {
                        board[r][c] = 'X';
                        if (checkWin(r, c, 'X')) {
                            board[r][c] = '';
                            return { r, c }; // Chặn ngay lập tức
                        }
                        board[r][c] = '';
                    }
                }
            }
            return getSmartRandomMove();
        }

        function getSmartRandomMove() {
            let emptyCells = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') {
                        let hasNeighbor = false;
                        for(let dr = -2; dr <= 2; dr++) {
                            for(let dc = -2; dc <= 2; dc++) {
                                let nr = r + dr, nc = c + dc;
                                if(nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== '') {
                                    hasNeighbor = true;
                                }
                            }
                        }
                        if(hasNeighbor || board[7][7] === '') emptyCells.push({r, c});
                    }
                }
            }
            if (emptyCells.length === 0) return {r: 7, c: 7};
            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        function evaluatePosition(r, c, player) {
            const directions = [{ dr: 0, dc: 1 }, { dr: 1, dc: 0 }, { dr: 1, dc: 1 }, { dr: 1, dc: -1 }];
            let totalScore = 0;
            directions.forEach(dir => {
                let count = 1, blocked = 0;
                let i = 1;
                while (true) {
                    let nr = r + dir.dr * i, nc = c + dir.dc * i;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) { blocked++; break; }
                    if (board[nr][nc] === player) { count++; i++; }
                    else if (board[nr][nc] !== '') { blocked++; break; }
                    else break;
                }
                i = 1;
                while (true) {
                    let nr = r - dir.dr * i, nc = c - dir.dc * i;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) { blocked++; break; }
                    if (board[nr][nc] === player) { count++; i++; }
                    else if (board[nr][nc] !== '') { blocked++; break; }
                    else break;
                }
                if (count >= 5) totalScore += 100000;
                else if (count === 4 && blocked === 0) totalScore += 10000;
                else if (count === 4 && blocked === 1) totalScore += 1000;
                else if (count === 3 && blocked === 0) totalScore += 1000;
                else if (count === 3 && blocked === 1) totalScore += 100;
                else if (count === 2) totalScore += 10;
            });
            return totalScore;
        }

        function checkWin(r, c, player) {
            const directions = [{ dr: 0, dc: 1 }, { dr: 1, dc: 0 }, { dr: 1, dc: 1 }, { dr: 1, dc: -1 }];
            return directions.some(dir => {
                let count = 1;
                let i = 1;
                while (r + dir.dr * i >= 0 && r + dir.dr * i < BOARD_SIZE && c + dir.dc * i >= 0 && c + dir.dc * i < BOARD_SIZE && board[r + dir.dr * i][c + dir.dc * i] === player) { count++; i++; }
                i = 1;
                while (r - dir.dr * i >= 0 && r - dir.dr * i < BOARD_SIZE && c - dir.dc * i >= 0 && c - dir.dc * i < BOARD_SIZE && board[r - dir.dr * i][c - dir.dc * i] === player) { count++; i++; }
                return count >= 5;
            });
        }

        function checkDraw() {
            return board.flat().every(cell => cell !== '');
        }

        function updateTurnDisplay() {
            const indicator = document.getElementById('turn-indicator');
            const colorClass = currentPlayer === 'X' ? 'var(--x-color)' : 'var(--o-color)';
            let roleTxt = gameMode === 'Online' ? ` (Bạn: ${myRole})` : '';
            indicator.innerHTML = `Lượt: <span style="color: ${colorClass};">${currentPlayer}</span>${roleTxt}`;
        }

        function resetGame() {
            if (gameMode === 'Online' && onlineConn && onlineConn.open) {
                onlineConn.send({ type: 'reset' });
            }
            executeReset();
        }

        function executeReset() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
            gameActive = true;
            currentPlayer = 'X';
            updateTurnDisplay();
            createBoard();
        }

        function endGame(winner) {
            gameActive = false;
            const modal = document.getElementById('win-modal');
            const wText = document.getElementById('winner-text');
            const rText = document.getElementById('reward-text');

            if (winner === 'Draw') {
                wText.innerText = "Hòa Cờ!";
                rText.innerText = "Không có xu nào được cộng.";
            } else {
                wText.innerText = `${winner} Thắng Cuộc!`;
                if (gameMode === 'Online') {
                    if (winner === myRole) {
                        coins += 25;
                        rText.innerText = "Thắng Online! Nhận +25 xu!";
                    } else {
                        rText.innerText = "Đối thủ đã thắng!";
                    }
                } else {
                    if (winner === 'X') {
                        coins += 20;
                        rText.innerText = "Bạn nhận được +20 xu!";
                    } else {
                        rText.innerText = "Máy đã thắng!";
                    }
                }
                localStorage.setItem('caro_coins', coins);
                document.getElementById('coin-count').innerText = coins;
            }
            modal.classList.add('show');
        }

        function closeWinModal() {
            document.getElementById('win-modal').classList.remove('show');
            resetGame();
        }

        function openShopModal() { document.getElementById('shop-modal').classList.add('show'); }
        function openSettingsModal() { document.getElementById('settings-modal').classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        function setTheme(themeName, cost) {
            if (cost > 0 && coins < cost) {
                alert("Bạn không đủ xu để mở khóa giao diện này!");
                return;
            }
            if (cost > 0) {
                coins -= cost;
                localStorage.setItem('caro_coins', coins);
                document.getElementById('coin-count').innerText = coins;
            }
            document.body.className = `theme-${themeName}`;
            localStorage.setItem('caro_theme', themeName);

            const buttons = document.querySelectorAll('.shop-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event && event.target && event.target.classList.add('active');

            // Xóa hiệu ứng cũ
            document.querySelectorAll('.falling-item').forEach(el => el.remove());

            if (themeName === 'pink') {
                createFallingAnimation('sakura', '#ffb7c5', 16);
            } else if (themeName === 'green') {
                createFallingAnimation('mint-leaf', '#a7f3d0', 16);
            }
        }

        function createFallingAnimation(className, color, count) {
            for(let i=0; i<count; i++) {
                let item = document.createElement('div');
                item.classList.add('falling-item', className);
                item.style.backgroundColor = color;
                item.style.left = Math.random() * 100 + 'vw';
                item.style.animationDuration = (Math.random() * 3.5 + 3) + 's';
                item.style.animationDelay = (Math.random() * 5) + 's';
                item.style.width = (Math.random() * 8 + 6) + 'px';
                item.style.height = item.style.width;
                if(className === 'mint-leaf') {
                    item.style.borderRadius = '50% 0 50% 50%'; // Tạo hình chiếc lá
                }
                document.body.appendChild(item);
            }
        }

        let audioCtx = null;
        let bgmInterval = null;
        let isBgmPlaying = false;

        function playSFX() {
            let sfxVol = parseFloat(document.getElementById('sfx-volume').value);
            if (sfxVol === 0) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(sfxVol * 0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }

        function toggleBGM() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isBgmPlaying = !isBgmPlaying;
            if (isBgmPlaying) {
                startChillBGM();
                alert("Đã bật nhạc nền Chill!");
            } else {
                clearInterval(bgmInterval);
                alert("Đã tắt nhạc nền!");
            }
        }

        function startChillBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
            bgmInterval = setInterval(() => {
                let bgmVol = parseFloat(document.getElementById('bgm-volume').value);
                if (!isBgmPlaying || bgmVol === 0) return;
                try {
                    let note = notes[Math.floor(Math.random() * notes.length)];
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note, audioCtx.currentTime);
                    gain.gain.setValueAtTime(bgmVol * 0.12, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.4);
                } catch(e) {}
            }, 1900);
        }

        function updateVolume() {
            let bgmVol = parseFloat(document.getElementById('bgm-volume').value);
            if (bgmVol > 0 && !isBgmPlaying) {
                isBgmPlaying = true;
                startChillBGM();
            }
        }

        function initPeerConnection() {
            const shortId = Math.floor(1000 + Math.random() * 9000).toString();
            onlinePeer = new Peer('caro-' + shortId);

            onlinePeer.on('open', (id) => {
                let code = id.replace('caro-', '');
                document.getElementById('room-code-input').value = code;
                document.getElementById('connection-status').innerText = `Mã phòng của bạn: ${code}`;
            });

            onlinePeer.on('connection', (conn) => {
                onlineConn = conn;
                myRole = 'X';
                setupOnlineEvents();
                document.getElementById('connection-status').innerText = "Đối thủ đã vào! Bạn là X (Đi trước).";
                alert("Đối thủ đã kết nối! Bạn cầm quân X.");
            });
        }

        function createRoom() {
            if(!onlinePeer) initPeerConnection();
            alert("Mã phòng của bạn đã hiển thị ở ô nhập mã. Hãy gửi cho bạn bè nhé!");
        }

        function joinRoom() {
            let code = document.getElementById('room-code-input').value.trim();
            if (code.length !== 4) {
                alert("Vui lòng nhập đúng mã phòng 4 số!");
                return;
            }
            if (!onlinePeer) {
                onlinePeer = new Peer();
                onlinePeer.on('open', () => doConnect(code));
            } else {
                doConnect(code);
            }
        }

        function doConnect(code) {
            document.getElementById('connection-status').innerText = "Đang kết nối...";
            onlineConn = onlinePeer.connect('caro-' + code);
            myRole = 'O';

            onlineConn.on('open', () => {
                document.getElementById('connection-status').innerText = "Đã kết nối! Bạn là O (Đi sau).";
                alert("Vào phòng thành công! Bạn là O.");
                setupOnlineEvents();
            });

            onlineConn.on('error', () => {
                alert("Không thể kết nối phòng này!");
            });
        }

        function setupOnlineEvents() {
            onlineConn.on('data', (data) => {
                if (data.type === 'move') {
                    makeMove(data.r, data.c, data.player);
                    playSFX();
                    if (checkWin(data.r, data.c, data.player)) {
                        endGame(data.player);
                        return;
                    }
                    if (checkDraw()) {
                        endGame('Draw');
                        return;
                    }
                    currentPlayer = data.player === 'X' ? 'O' : 'X';
                    updateTurnDisplay();
                } else if (data.type === 'reset') {
                    executeReset();
                }
            });
        }
    </script>
</body>
</html>
