<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Caro Siêu Cấp - 15x15</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --board-bg: #1e293b;
            --cell-bg: #334155;
            --cell-hover: #475569;
            --x-color: #f43f5e;
            --o-color: #38bdf8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        /* Theme: Hồng Pastel kết hợp Hoa Anh Đào */
        body.theme-pink {
            --bg-color: #fff1f2;
            --panel-bg: rgba(255, 228, 230, 0.85);
            --text-color: #881337;
            --accent-color: #f43f5e;
            --accent-hover: #e11d48;
            --board-bg: #ffe4e6;
            --cell-bg: #fecdd3;
            --cell-hover: #fda4af;
            --x-color: #be123c;
            --o-color: #0284c7;
            background-image: radial-gradient(#fda4af 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Theme: Xanh Bạc Hà */
        body.theme-green {
            --bg-color: #ecfdf5;
            --panel-bg: rgba(209, 250, 229, 0.85);
            --text-color: #064e3b;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --board-bg: #d1fae5;
            --cell-bg: #a7f3d0;
            --cell-hover: #6ee7b7;
            --x-color: #047857;
            --o-color: #2563eb;
        }

        /* Theme: Tím Huyền Ảo */
        body.theme-purple {
            --bg-color: #1e1b4b;
            --panel-bg: rgba(49, 46, 129, 0.8);
            --text-color: #e0e7ff;
            --accent-color: #a855f7;
            --accent-hover: #9333ea;
            --board-bg: #312e81;
            --cell-bg: #3730a3;
            --cell-hover: #4338ca;
            --x-color: #ec4899;
            --o-color: #38bdf8;
        }

        /* Theme: Vàng Hoàng Gia */
        body.theme-gold {
            --bg-color: #1c1917;
            --panel-bg: rgba(41, 37, 36, 0.85);
            --text-color: #fef08a;
            --accent-color: #eab308;
            --accent-hover: #ca8a04;
            --board-bg: #292524;
            --cell-bg: #44403c;
            --cell-hover: #57534e;
            --x-color: #fb7185;
            --o-color: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* Màn hình chờ / Menu chính */
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 50;
            padding: 20px;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .menu-card {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .menu-card h1 {
            font-size: 2.5rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .menu-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* Giao diện game chính */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 720px;
            width: 100%;
        }

        .game-container.hidden {
            display: none;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            font-weight: 650;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Khung Online */
        .online-panel {
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .online-panel input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
            width: 150px;
            text-align: center;
            font-weight: bold;
        }

        /* Bàn cờ 15x15 */
        .board-container {
            background: var(--panel-bg);
            padding: 14px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 3px;
            background-color: var(--board-bg);
            padding: 5px;
            border-radius: 8px;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        .cell:hover {
            background-color: var(--cell-hover);
            transform: scale(1.05);
        }

        .cell.x { color: var(--x-color); text-shadow: 0 0 8px rgba(244, 63, 94, 0.4); }
        .cell.o { color: var(--o-color); text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }

        /* Modal / Cửa hàng / Setting chung */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.15);
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 { margin-bottom: 15px; font-size: 1.6rem; }

        .shop-items {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .shop-btn {
            background: var(--cell-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 8px 14px;
            font-size: 0.85rem;
        }

        .shop-btn.active { border-color: var(--accent-color); }

        .setting-group {
            margin: 15px 0;
            text-align: left;
        }

        .setting-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .setting-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        /* Hiệu ứng hoa anh đào rơi cho theme hồng */
        .sakura {
            position: fixed;
            top: -10px;
            background: pink;
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }
    </style>
</head>
<body class="theme-default">

    <!-- MÀN HÌNH CHỜ (MENU CHÍNH) -->
    <div class="screen" id="main-menu">
        <div class="menu-card">
            <h1>Cờ Caro Siêu Cấp</h1>
            <button class="menu-btn" onclick="openModeSelect()">🎮 Chơi Ngay</button>
            <button class="menu-btn" onclick="openShopModal()" style="background: #10b981;">🎨 Cửa Hàng Giao Diện</button>
            <button class="menu-btn" onclick="openSettingsModal()" style="background: #64748b;">⚙️ Cài Đặt Âm Thanh</button>
        </div>
    </div>

    <!-- MÀN HÌNH CHỌN CHẾ ĐỘ CHƠI -->
    <div class="screen hidden" id="mode-select-screen">
        <div class="menu-card">
            <h1>Chọn Chế Độ</h1>
            <button class="menu-btn" onclick="startGameMode('AI-Easy')">🤖 Đấu với Máy (Dễ)</button>
            <button class="menu-btn" onclick="startGameMode('AI-Medium')">🧠 Đấu với Máy (Trung Bình)</button>
            <button class="menu-btn" onclick="startGameMode('AI-Hard')">🔥 Đấu với Máy (Khó)</button>
            <button class="menu-btn" onclick="startGameMode('Local')">👥 2 Người (Chung Máy)</button>
            <button class="menu-btn" onclick="startGameMode('Online')" style="background: #0284c7;">🌐 Chế Độ Online</button>
            <button class="menu-btn" onclick="backToMenu()" style="background: #ef4444;">⬅️ Quay Lại</button>
        </div>
    </div>

    <!-- GIAO DIỆN GAME CHÍNH -->
    <div class="game-container hidden" id="game-screen">
        <header>
            <h1 style="font-size: 1.8rem; letter-spacing: 1px;">CỜ CARO 15x15</h1>
        </header>

        <div class="stats-bar">
            <div id="turn-indicator">Lượt: <span style="color: var(--x-color);">X</span></div>
            <div>💰 Xu: <span id="coin-count">100</span></div>
            <div>Chế độ: <span id="mode-display">Đấu với Máy</span></div>
            <button onclick="backToMenu()" style="padding: 3px 8px; font-size: 0.8rem; background: #ef4444;">Menu</button>
        </div>

        <div class="controls">
            <button onclick="resetGame()">🔄 Ván Mới</button>
            <button onclick="openShopModal()">🎨 Đổi Giao Diện</button>
            <button onclick="openSettingsModal()">⚙️ Cài Đặt</button>
        </div>

        <!-- Khung Online -->
        <div class="online-panel" id="online-controls" style="display: none;">
            <button onclick="createRoom()">Tạo Phòng</button>
            <input type="text" id="room-code-input" placeholder="Mã 4 số">
            <button onclick="joinRoom()">Vào Phòng</button>
            <span id="connection-status" style="font-size: 0.85rem; opacity: 0.8; width: 100%; text-align: center;">Chưa kết nối phòng</span>
        </div>

        <div class="board-container">
            <div class="board" id="board"></div>
        </div>
    </div>

    <!-- MODAL CỬA HÀNG GIAO DIỆN -->
    <div class="modal" id="shop-modal">
        <div class="modal-content">
            <h2>Cửa Hàng Giao Diện</h2>
            <div class="shop-items">
                <button class="shop-btn active" onclick="setTheme('default', 0)">Mặc Định (0 xu)</button>
                <button class="shop-btn" onclick="setTheme('pink', 40)">🌸 Hồng Sakura (40 xu)</button>
                <button class="shop-btn" onclick="setTheme('green', 40)">🌿 Xanh Bạc Hà (40 xu)</button>
                <button class="shop-btn" onclick="setTheme('purple', 60)">🔮 Tím Huyền Ảo (60 xu)</button>
                <button class="shop-btn" onclick="setTheme('gold', 60)">👑 Vàng Hoàng Gia (60 xu)</button>
            </div>
            <button onclick="closeModal('shop-modal')">Đóng</button>
        </div>
    </div>

    <!-- MODAL CÀI ĐẶT ÂM THANH -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2>Cài Đặt Âm Thanh</h2>
            <div class="setting-group">
                <label>🎵 Nhạc Nền Chill:</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.3" oninput="updateVolume()">
                    <button onclick="toggleBGM()" id="bgm-toggle-btn" style="padding: 5px 10px; font-size: 0.8rem;">Tắt/Bật</button>
                </div>
            </div>
            <div class="setting-group">
                <label>🔊 Âm Thanh Đánh Cờ (SFX):</label>
                <input type="range" id="sfx-volume" min="0" max="1" step="0.05" value="0.6">
            </div>
            <br>
            <button onclick="closeModal('settings-modal')">Lưu & Đóng</button>
        </div>
    </div>

    <!-- MODAL THẮNG / THUA -->
    <div class="modal" id
